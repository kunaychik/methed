<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOnline</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__grid">
            <img class="header__log" src="/img/header/Logo.svg" alt="">

            <button class="header__button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_10301_14)">
                      <path d="M3 18H9V16H3V18ZM3 6V8H21V6H3ZM3 13H15V11H3V13Z" fill="white" />
                    </g>
                    <defs>
                      <clipPath id="clip0_10301_14">
                        <rect width="24" height="24" fill="white" />
                      </clipPath>
                    </defs>
                  </svg>       
                  Меню 
            </button>
            
            
            <div class="header__search">
                <input class="header__input-search" type="text" placeholder="Я ищу...">
            </div>

            <div class="header__icons">
              <div class="header__icon header__lk">
                  <img class="header__lk-icon" src="/img/header/person.svg" alt="">
                  <p class="header__lk-caption">Профиль</p>
              </div>

              <div class="header__icon header__basket">
                  <img class="header__lk-icon" src="/img/header/shopping_cart.svg" alt="">
                  <p class="header__lk-caption">Корзина</p>
              </div>

              <div class="header__icon header__like">
                  <img class="header__lk-icon" src="/img/header/favorite.svg" alt="">
                  <p class="header__lk-caption">Избранное</p>
              </div>
            </div>
        </div>
    </header>
    <main class="main">
      <div class="container">
        <div class="gallery">
          <img class="gallery__icon gallery__icon-01" src="/img/gallery/banner.png" alt="">
          <img class="gallery__icon gallery__icon-02" src="/img/gallery/Group 136.png" alt="">
          <img class="gallery__icon gallery__icon-03" src="/img/gallery/Group 137.png" alt="">
          <img class="gallery__icon gallery__icon-04" src="/img/gallery/Group 139.png" alt="">
          <img class="gallery__icon gallery__icon-05" src="/img/gallery/Group 141.png" alt="">
          <img class="gallery__icon gallery__icon-06" src="/img/gallery/Group 138.png" alt="">
          <img class="gallery__icon gallery__icon-07" src="/img/gallery/Group 140.png" alt="">
          <img class="gallery__icon gallery__icon-08" src="/img/gallery/Group 144.png" alt="">
          <img class="gallery__icon gallery__icon-09" src="/img/gallery/Group 143.png" alt="">
          <img class="gallery__icon gallery__icon-10" src="/img/gallery/Group 142.png" alt="">
          <img class="gallery__icon gallery__icon-11" src="/img/gallery/Rectangle 108.png" alt="">
        </div>
      </div>
    </main>
</body>
</html>
