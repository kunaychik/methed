<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOnline</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <img class="header__log" src="" alt="">

            <button class="header__button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_10301_14)">
                      <path d="M3 18H9V16H3V18ZM3 6V8H21V6H3ZM3 13H15V11H3V13Z" fill="white" />
                    </g>
                    <defs>
                      <clipPath id="clip0_10301_14">
                        <rect width="24" height="24" fill="white" />
                      </clipPath>
                    </defs>
                  </svg>
                  Меню
            </button>
            
            <div class="header__search">
                <input class="header__input-search" type="text">
                <button class="header__button-search">
                    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_10301_7)">
                          <path d="M23.25 21H22.065L21.645 20.595C23.115 18.885 24 16.665 24 14.25C24 8.865 19.635 4.5 14.25 4.5C8.865 4.5 4.5 8.865 4.5 14.25C4.5 19.635 8.865 24 14.25 24C16.665 24 18.885 23.115 20.595 21.645L21 22.065V23.25L28.5 30.735L30.735 28.5L23.25 21ZM14.25 21C10.515 21 7.5 17.985 7.5 14.25C7.5 10.515 10.515 7.5 14.25 7.5C17.985 7.5 21 10.515 21 14.25C21 17.985 17.985 21 14.25 21Z" fill="white" />
                        </g>
                        <defs>
                          <clipPath id="clip0_10301_7">
                            <rect width="36" height="36" fill="white" />
                          </clipPath>
                        </defs>
                      </svg>
                </button>
            </div>

            <div class="header__lk">
                <img class="header__lk-icon" src="/img/header/person.svg" alt="">
                <p class="header__lk-caption">Профиль</p>
            </div>

            <div class="header__basket">
                <img class="header__lk-icon" src="/img/header/shopping_cart.svg" alt="">
                <p class="header__lk-caption">Корзина</p>
            </div>

            <div class="header__like">
                <img class="header__lk-icon" src="/img/header/favorite.svg" alt="">
                <p class="header__lk-caption">Избранное</p>
            </div>
        </div>
    </header>
    <main class="main"></main>
</body>
</html>
